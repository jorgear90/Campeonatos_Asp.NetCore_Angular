<div *ngIf="equipo">
  <h2>Editar equipo</h2>
  <img [src]="getLogoUrl(equipo)" alt="Logo del equipo" width="80">
  <input type="text" [(ngModel)]="equipo.nombre" placeholder="Nombre" value="{{equipo.nombre}}" />
  <div class="mb-3">
    <label>Región</label>
    <select class="form-select" [(ngModel)]="regionSeleccionada" (change)="onRegionChange()">
      <option *ngFor="let region of regiones" [value]="region.id">
        {{ region.nombre }}
      </option>
    </select>
  </div>

  <div class="mb-3">
    <label>Comuna</label>
    <select class="form-select" [(ngModel)]="comunaSeleccionada">
      <option *ngFor="let comuna of comunas" [value]="comuna.id">
        {{ comuna.nombre }}
      </option>
    </select>
  </div>
  <input id="inputFile" type="file" (change)="onFileSelected($event)" accept="image/*" />
  <button (click)="onSubmit()">Editar</button>
  <div *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</div>
</div>
<app-return-button [returnPath]="'/my-teams'" [buttonText]="'Volver'"></app-return-button>
<button (click)="restaurarEquipo()">Restaurar</button>
