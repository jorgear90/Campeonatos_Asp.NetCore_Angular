<div>
  <h2>Crear cuenta</h2>
  <input type="email" [(ngModel)]="correo" placeholder="Correo" />
  <input type="password" [(ngModel)]="password" placeholder="Contraseña" />
  <input type="password" [(ngModel)]="confirmPassword" placeholder="Repite la contraseña" />
  <button (click)="register()">Guardar</button>
  <div *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</div>
</div>
<app-is-loading [isLoading]="isLoading"></app-is-loading>
